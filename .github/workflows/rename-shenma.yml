name: Rename shenma verification file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file with git mv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv browser-download-20261029T022611.761676624Z-2-shenma-site-verification.txt shenma-site-verification.txt
          ls -l shenma-site-verification.txt
          wc -c shenma-site-verification.txt
          git status --short
          git commit -m "Rename shenma verification file via git mv"
          git push
